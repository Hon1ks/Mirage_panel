name: CI

# Manual only: run it from the Actions tab («Run workflow»). Changes are built and tested on the
# server before they are pushed, so a run on every push only spent Actions minutes.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx tsc --noEmit -p server/tsconfig.json
      - run: NODE_ENV=test npx vitest run src
      - run: npm test
      - run: npm run build
